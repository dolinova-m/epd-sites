<!doctype html>
<!--
  ПРОД — живая версия, деплоится автоматически на /epd-kalkulyator/ при пуше в main
  (см. .github/workflows/deploy-epd-kalkulyator.yml). Логика квиза — каждая роль на одном экране,
  описана в ЛОГИКА-КВИЗА-новая-версия.md в этой же папке.
  Черновики для правок и проверки — тестовый-контур.html и тестовый-контур-2.html (в деплой не попадают).
  После правок здесь пересобрать пакет для разработчика: python3 собрать-для-разработчика.py
  Шрифт — минимум 14px везде.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор документов ЭПД — сколько подписывать и сколько это стоит</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=Roboto:wght@400;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f7f7f7;
    --surface-3: #ededed;
    --ink: #16181b;
    --ink-dim: #53585f;
    --ink-faint: #8a9098;
    --border: #e6e6e6;
    --border-strong: #cfcfcf;
    --accent: #ff7322;
    --accent-ink: #b3450c;
    --accent-soft: #ffe9db;
    --navy: #0c2a48;
    --navy-2: #123f6c;
    --navy-ink: #ffffff;
    --good: #2f8f5b;
    --good-soft: #e2f3ea;
    --info: #2e6e95;
    --info-soft: #e3eff6;
    --warn: #a8690f;
    --warn-soft: #fbead2;
    --paid: #a13a3a;
    --paid-soft: #fbeeee;
    --shadow: 0 1px 2px rgba(0,0,0,.05), 0 10px 28px -14px rgba(0,0,0,.16);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;
    --font-display: "Nunito Sans", "PT Sans", system-ui, sans-serif;
    --font-body: "Roboto", "Segoe UI", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
  }

  /* Тёмная палитра объявлена дважды намеренно: по системной теме и по data-theme="dark"
     на контейнере — второй способ описан в для-разработчика/README.md как способ
     закрепить тему на корпоративном сайте. Значения менять синхронно. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14181d; --surface: #1b2129; --surface-2: #212832; --surface-3: #2a323d;
      --ink: #eef1f4; --ink-dim: #a7b0ba; --ink-faint: #7a838e;
      --border: #2c333d; --border-strong: #3a4350;
      --accent: #ff8a45; --accent-ink: #ffcf8c; --accent-soft: #3c2814;
      --navy: #1c3a5c; --navy-2: #2a5580; --navy-ink: #ffffff;
      --good: #57cc91; --good-soft: #102a1e;
      --info: #74bce6; --info-soft: #102838;
      --warn: #e3ac54; --warn-soft: #362a16;
      --paid: #e08787; --paid-soft: #351d1d;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14181d; --surface: #1b2129; --surface-2: #212832; --surface-3: #2a323d;
    --ink: #eef1f4; --ink-dim: #a7b0ba; --ink-faint: #7a838e;
    --border: #2c333d; --border-strong: #3a4350;
    --accent: #ff8a45; --accent-ink: #ffcf8c; --accent-soft: #3c2814;
    --navy: #1c3a5c; --navy-2: #2a5580; --navy-ink: #ffffff;
    --good: #57cc91; --good-soft: #102a1e;
    --info: #74bce6; --info-soft: #102838;
    --warn: #e3ac54; --warn-soft: #362a16;
    --paid: #e08787; --paid-soft: #351d1d;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 34px -16px rgba(0,0,0,.65);
  }

  * { box-sizing: border-box; }
  /* Атрибут hidden должен побеждать display: grid/flex у блоков экранов ролей. */
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
  @media (prefers-reduced-motion: reduce) { * { animation-duration: .001ms !important; transition-duration: .001ms !important; } }
  a { color: inherit; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px 80px; }
  b { color: var(--ink); }

  /* ---- top bar ---- */
  .topbar { border-bottom: 1px solid var(--border); padding: 16px 0; margin-bottom: 8px; }
  .topbar-inner { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 700; font-size: 14.5px; color: var(--ink-dim); letter-spacing: .01em; }
  .brand img { height: 30px; display: block; }
  .brand b { color: var(--ink); }
  .topbar-tag { font-size: 14px; color: var(--ink-faint); text-align: right; line-height: 1.4; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  @media (max-width: 620px) { .topbar-tag { display: none; } }

  /* ---- hero / start ---- */
  .hero { padding: 44px 0 8px; max-width: 1100px; margin: 0 auto; text-align: left; }
  .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--accent-ink); background: var(--accent-soft); padding: 6px 12px; border-radius: 999px; margin-bottom: 16px; }
  h1 { font-family: var(--font-display); font-size: clamp(26px, 4.4vw, 38px); font-weight: 800; letter-spacing: -.01em; margin: 0 0 14px; text-wrap: balance; color: var(--ink); }
  .hero p.lead { font-size: 16.5px; color: var(--ink-dim); margin: 0 0 26px; }
  .hero-points { display: grid; gap: 10px; margin-bottom: 30px; }
  .hero-point { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--ink-dim); }
  .hero-point svg { flex: none; margin-top: 3px; color: var(--good); }
  .promo-hero { display: flex; align-items: center; gap: 22px; margin: 0 0 30px; padding: 22px 28px; border-radius: var(--radius-lg); background: var(--navy); color: #fff; }
  .promo-hero-num { flex: none; font-family: var(--font-display); font-weight: 800; font-size: 72px; line-height: 1; letter-spacing: -.02em; color: var(--accent); }
  .promo-hero-label { font-size: 14px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: rgba(255,255,255,.75); margin-bottom: 4px; }
  .promo-hero-text { font-family: var(--font-display); font-weight: 800; font-size: clamp(20px, 3.2vw, 28px); line-height: 1.25; text-wrap: balance; }
  @media (max-width: 620px) { .promo-hero { gap: 16px; padding: 18px 20px; } .promo-hero-num { font-size: 56px; } }

  /* ---- buttons ---- */
  .btn { font-family: var(--font-display); font-weight: 700; font-size: 15px; padding: 13px 26px; border-radius: 10px; border: none; cursor: pointer; display: inline-block; text-decoration: none; }
  .btn-primary { background: var(--navy); color: #fff; }
  .btn-primary:hover { background: var(--navy-2); }
  .btn-primary:disabled { opacity: .35; cursor: not-allowed; }
  .btn-ghost { background: transparent; color: var(--ink-dim); padding: 13px 8px; }
  .btn-outline { background: var(--surface); color: var(--ink); border: 1.5px solid var(--border-strong); padding: 11px 18px; white-space: nowrap; }
  .btn-outline:hover { border-color: var(--accent); color: var(--accent-ink); }
  .btn-ghost:hover { color: var(--ink); }

  /* ---- quiz shell ---- */
  .quiz-shell { max-width: 1100px; margin: 0 auto; padding: 24px 0 100px; }
  .progress-track { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin-bottom: 22px; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .25s ease; }
  .trail { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .role-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; padding: 5px 11px; border-radius: 999px; background: var(--surface-2); color: var(--ink-dim); font-family: var(--font-mono); border: 1.5px solid transparent; }
  .role-chip svg { flex: none; }
  .role-chip.active { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
  .role-chip.done { background: var(--good-soft); color: var(--good); }
  .role-chip.done.excluded { opacity: .6; }

  .q-title { font-family: var(--font-display); font-weight: 800; font-size: 22px; margin: 0 0 8px; color: var(--ink); text-wrap: balance; }
  .q-hint { font-size: 14.5px; color: var(--ink-dim); margin: 0 0 22px; }
  /* Без подсказки под заголовком блоки прилипают к нему: возвращаем тот же отступ. */
  .q-title + .method-list, .q-title + .form-card, .q-title + .check-list { margin-top: 22px; }

  .opt-list { display: grid; gap: 10px; margin-bottom: 8px; }
  .opt-btn { display: flex; align-items: flex-start; gap: 12px; text-align: left; padding: 15px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; font-family: var(--font-body); color: var(--ink); width: 100%; transition: border-color .15s ease, background .15s ease, transform .1s ease; }
  .opt-btn:hover { border-color: var(--border-strong); }
  .opt-btn:active { transform: scale(.99); }
  .opt-btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .opt-title { display: block; font-weight: 700; font-size: 15px; margin-bottom: 2px; }
  .opt-desc { display: block; font-size: 14px; color: var(--ink-dim); line-height: 1.4; }

  .check-list { display: grid; gap: 10px; margin-bottom: 8px; }
  .check-item { display: flex; align-items: flex-start; gap: 12px; padding: 15px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface); cursor: pointer; }
  .check-item.checked { border-color: var(--accent); background: var(--accent-soft); }
  .check-item input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
  .check-item .ci-title { display: block; font-weight: 700; font-size: 15px; }
  .check-item .ci-desc { display: block; font-size: 14px; color: var(--ink-dim); margin-top: 2px; }

  .toggle-row { display: flex; gap: 8px; }
  .toggle-row .opt-btn { flex: 1; align-items: center; justify-content: center; text-align: center; padding: 12px 10px; }
  .toggle-row .opt-title { margin: 0; }

  .num-input { width: 110px; padding: 10px 12px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-size: 15px; font-family: var(--font-mono); background: var(--surface); color: var(--ink); }
  .num-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .quiz-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 26px; }

  /* ---- экраны ролей: способы перевозки с числовыми полями ---- */
  .method-list { display: grid; gap: 12px; }
  .method { border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface); overflow: hidden; }
  .method.checked { border-color: var(--accent); }
  .method > .check-item { border: none; border-radius: 0; background: transparent; }
  .method.checked > .check-item { background: var(--accent-soft); }
  .method-body, .form-card { display: grid; gap: 16px; padding: 16px; }
  .field-stack { display: grid; gap: 16px; }
  .form-card { border: 1.5px solid var(--border); border-radius: var(--radius-md); background: var(--surface); margin-top: 12px; }
  .method-body .callout, .form-card .callout { margin: 0; }
  .method-body .opt-list { margin-bottom: 0; }
  /* Третья колонка-пустышка тянет сетку на всю ширину карточки: подпись и пояснение
     не жмутся в узкий столбец и не ломаются на лишние строки. */
  .num-field { display: grid; grid-template-columns: minmax(0, 480px) 110px minmax(0, 1fr); align-items: center; gap: 6px 16px; }
  .num-field label { font-size: 15px; font-weight: 600; color: var(--ink); }
  .num-note { grid-column: 1 / -1; font-size: 14px; color: var(--ink-dim); line-height: 1.45; }
  .field-label { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: -8px; }
  .field-note { font-size: 14px; color: var(--ink-dim); line-height: 1.45; }
  .choice-group + .choice-group { margin-top: 22px; }
  .choice-group .field-label { margin-bottom: 10px; }
  .form-error { margin: 12px 0 0; font-size: 14px; font-weight: 600; color: var(--paid); }
  /* Подсветка незаполненного: поле, группа вариантов или список галочек. */
  .num-field.invalid .num-input, .lead-form input.invalid { border-color: var(--paid); background: var(--paid-soft); }
  /* На подсвеченном поле оранжевая рамка фокуса давала вторую обводку — оставляем только красную. */
  .num-field.invalid .num-input:focus, .lead-form input.invalid:focus { outline: none; border-color: var(--paid); }
  .opt-list.invalid, .check-list.invalid, .method-list.invalid { outline: 2px solid var(--paid); outline-offset: 6px; border-radius: var(--radius-md); }
  .form-error:empty { display: none; }
  @media (max-width: 620px) {
    .num-field { grid-template-columns: 1fr; }
    .method-body, .form-card { padding: 14px; }
  }

  /* ---- result panel (reused for cards & accordions) ---- */
  .result { margin-top: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); padding: 24px 28px; }
  .result + .result { margin-top: 16px; }
  .result-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .result-head h2 { margin-bottom: 0; }
  .result-eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .result h2 { font-family: var(--font-display); font-size: 22px; font-weight: 800; margin: 0 0 10px; color: var(--ink); text-wrap: balance; }
  .result h3 { font-family: var(--font-display); font-size: 16.5px; font-weight: 700; margin: 20px 0 8px; color: var(--ink); }
  .result h3:first-child { margin-top: 0; }
  .result .lead { color: var(--ink-dim); font-size: 15px; margin: 0 0 6px; }
  .result p { color: var(--ink-dim); font-size: 14.5px; }
  .result ul { margin: 6px 0; padding-left: 20px; color: var(--ink-dim); font-size: 14.5px; }
  .result li { margin: 4px 0; }


  /* ---- оглавление результата ---- */
  /* Результат длинный, поэтому сбоку — липкий список разделов; на узком экране его нет совсем.
     На больших экранах блок шире обычной колонки: оглавление уходит влево за её край,
     а основная часть получает всю оставшуюся ширину. */
  /* Левый край держим по краю страницы (margin считаем от полной ширины 1400px),
     а саму ширину берём меньше — так справа остаётся воздух. */
  .result-layout { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start;
    max-width: none; width: min(1280px, calc(100vw - 48px)); margin-left: calc((100% - min(1400px, calc(100vw - 48px))) / 2); }
  .res-section { scroll-margin-top: 64px; }
  .res-section + .res-section { margin-top: 18px; }
  .toc { position: sticky; top: 56px; }
  .toc-title { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 10px; }
  .toc-link { display: block; padding: 8px 12px; border-left: 2px solid var(--border); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; font-size: 14px; line-height: 1.35; color: var(--ink-dim); text-decoration: none; }
  .toc-link:hover { color: var(--ink); background: var(--surface-2); }
  .toc-link.active { color: var(--accent-ink); background: var(--accent-soft); border-left-color: var(--accent); font-weight: 700; }
  @media (max-width: 1000px) {
    .result-layout { grid-template-columns: minmax(0, 1fr); gap: 0; width: auto; margin-left: 0; }
    .toc { display: none; }
  }

  .facts { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0 4px; }
  .fact-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; padding: 6px 11px; border-radius: 999px; background: var(--surface-2); color: var(--ink-dim); font-family: var(--font-mono); }
  .fact-chip.good { background: var(--good-soft); color: var(--good); }

  .big-number { font-family: var(--font-display); font-weight: 800; font-size: 34px; color: var(--ink); margin: 4px 0; }
  .big-number span { font-size: 16px; font-weight: 700; color: var(--ink-dim); margin-left: 6px; }

  .promo-pack { margin: 16px 0 12px; padding: 22px 26px; border-radius: var(--radius-md); background: var(--navy); color: #fff; }
  .promo-pack-eyebrow { font-size: 14px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.75); margin-bottom: 10px; }
  .promo-pack-main { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; }
  .promo-pack-docs { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 5vw, 44px); line-height: 1.1; }
  .promo-pack-docs s { font-size: .55em; font-weight: 700; opacity: .6; margin-right: 4px; text-decoration-thickness: 2px; }
  .promo-pack-docs span { font-size: .45em; font-weight: 700; }
  .promo-pack-price { font-family: var(--font-display); font-weight: 800; font-size: clamp(24px, 4vw, 32px); white-space: nowrap; }
  .promo-pack-price span { font-size: 16px; font-weight: 700; opacity: .75; }
  .promo-pack-gift { margin-top: 10px; font-family: var(--font-display); font-weight: 800; font-size: 18px; color: var(--accent); }
  .result .promo-pack p { margin: 10px 0 0; font-size: 14.5px; color: rgba(255,255,255,.85); }



  /* ---- что включено в цену: свёрнутый блок, внутри — сетка галочек, как в КП ---- */
  /* details.acc описан ниже по файлу, поэтому здесь нужен класс поверх него. */
  details.acc.incl-acc { margin-top: 18px; }
  .incl-sum-title { display: block; font-family: var(--font-display); font-weight: 800; font-size: 16.5px; line-height: 1.3; color: var(--ink); }
  .incl-sum-note { display: block; margin-top: 4px; font-family: var(--font-body); font-weight: 400; font-size: 14px; color: var(--ink-dim); }
  /* 360px держит две ровные колонки, как в КП: десять пунктов ложатся в пять строк.
     min(360px, 100%) — чтобы на узком экране колонка не вылезала за край карточки. */
  .incl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 8px; }
  .incl-item { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; border-radius: var(--radius-sm); background: var(--surface-2); font-size: 14px; line-height: 1.45; color: var(--ink-dim); }
  .incl-item .tick { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .incl-item b { color: var(--ink); }
  .result .incl-foot { margin: 12px 0 0; font-size: 14px; color: var(--ink-dim); line-height: 1.45; }
  @media (max-width: 620px) { .incl-sum-title { font-size: 15.5px; } }


  .doc-row { display: flex; gap: 14px; padding: 14px 0; border-top: 1px solid var(--border); align-items: flex-start; }
  .doc-row:first-child { border-top: none; padding-top: 4px; }
  /* Одинаковая ширина пометки держит названия документов на одной вертикали. */
  .doc-badge { flex: none; min-width: 112px; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; text-transform: uppercase; letter-spacing: .03em; margin-top: 2px; }
  .doc-badge.free { background: var(--good-soft); color: var(--good); }
  .doc-badge.paid { background: var(--surface-2); color: var(--accent); }
  .doc-name { font-weight: 700; font-size: 14.5px; color: var(--ink); margin-bottom: 3px; }
  .doc-desc { font-size: 14px; color: var(--ink-dim); }
  /* ---- подписи: короткие строки вместо пошаговых карточек ---- */
  .sign-row { padding: 14px 0; }
  .sign-row + .sign-row { border-top: 1px solid var(--border); }
  /* Плашка сразу говорит, кому блок и где подписывают: за компьютером или с телефона. */
  .sign-badge { display: inline-flex; align-items: center; font-family: var(--font-mono); font-size: 14px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-dim); margin-bottom: 7px; }
  .sign-badge.phone { background: var(--info-soft); color: var(--info); }
  .sign-name { font-weight: 700; font-size: 15px; color: var(--ink); margin-bottom: 4px; }
  .sign-desc { font-size: 14.5px; color: var(--ink-dim); line-height: 1.5; }
  .sign-desc + .sign-desc { margin-top: 4px; }
  /* Примечание — то, о чём клиент спотыкается: МЧД, где продают токен, что УКЭП только один. */
  .sign-note { display: flex; gap: 8px; margin-top: 8px; font-size: 14px; color: var(--ink-dim); line-height: 1.45; }
  .sign-note::before { content: "!"; flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-ink); font-family: var(--font-display); font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .sign-note a { color: var(--accent-ink); font-weight: 700; cursor: pointer; }
  .result .sign-foot { margin: 14px 0 0; font-size: 14px; color: var(--ink-dim); line-height: 1.45; }
  .result .sign-foot a { color: var(--accent-ink); font-weight: 700; }
  .docs-gap { height: 14px; }
  .doc-role-tag { font-size: 14px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .04em; font-weight: 700; margin-bottom: 6px; }
  /* Приложение — не документ, а инструмент: отделяем от строк .doc-row фоном, как у плашки info. */
  .doc-app { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-top: 10px; padding: 11px 14px; border-radius: var(--radius-sm); background: var(--info-soft); font-size: 14px; line-height: 1.45; color: var(--ink-dim); }
  .doc-app b { color: var(--info); }
  .doc-app-links { display: flex; flex-wrap: wrap; gap: 4px 14px; }
  .doc-app-links a { color: var(--info); font-weight: 700; text-decoration: underline; white-space: nowrap; }

  .callout { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; padding: 12px 16px; font-size: 14px; margin: 12px 0; border-left: 3px solid; color: var(--ink); }
  .callout.info { background: var(--info-soft); border-color: var(--info); }
  /* Списки внутри плашек и мелкие служебные классы — вместо инлайновых стилей в JS. */
  .callout ul { margin: 6px 0 0; padding-left: 18px; }
  .callout ul.closed-list { margin-top: 8px; }
  .callout a.manager-link { color: var(--info); text-decoration: underline; font-weight: 700; }
  .callout.info b { color: var(--info); }

  .table-scroll { overflow-x: auto; border-radius: var(--radius-md); border: 1px solid var(--border); margin: 12px 0; }
  table.money { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 14px; }
  table.money th, table.money td { padding: 12px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border); }
  table.money thead th { background: var(--surface-2); color: var(--ink-faint); font-family: var(--font-display); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--border-strong); }
  table.money tbody tr:last-child td { border-bottom: none; }
  table.money td.num { font-weight: 700; color: var(--ink); font-family: var(--font-mono); }
  table.money tfoot td { font-weight: 800; color: var(--ink); background: var(--surface-2); font-family: var(--font-display); }

  table.tariff { border-collapse: collapse; width: 100%; min-width: 420px; font-size: 14px; }
  table.tariff th, table.tariff td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--border); }
  table.tariff th { color: var(--ink-faint); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; }
  table.tariff td.num { font-weight: 700; color: var(--ink); font-family: var(--font-mono); }
  table.tariff tr.hit td { background: var(--accent-soft); }
  .result p.price-note { font-size: 14px; }
  table.tariff td s { color: var(--ink-faint); margin-right: 6px; }
  table.tariff td b { color: var(--accent-ink); }

  /* Оранжевая полоса слева оставляет блоку акцент, пока он закрыт: иначе его не заметят. */
  details.acc { border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius-md); margin-bottom: 10px; background: var(--surface); overflow: hidden; }
  details.acc summary { padding: 15px 18px; font-weight: 700; font-size: 14.5px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 16px; color: var(--ink); }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary::after { content: "+"; font-size: 20px; color: var(--ink-faint); font-weight: 400; }
  details.acc[open] summary::after { content: "–"; }
  details.acc .acc-body { padding: 0 18px 18px; }

  .section-head { margin: 40px 0 16px; }
  .section-head h2 { font-family: var(--font-display); font-size: 20px; font-weight: 800; margin: 0 0 6px; }
  .section-head p { color: var(--ink-dim); font-size: 14.5px; margin: 0; }

  .contacts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 10px; }
  .ccard { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px 18px; background: var(--surface); }
  .ccard .cc-role { font-size: 14px; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-ink); font-weight: 700; margin-bottom: 7px; }
  .ccard .cc-name { font-weight: 700; font-family: var(--font-display); font-size: 15px; margin-bottom: 6px; color: var(--ink); }
  .ccard .cc-line { font-size: 14px; color: var(--ink-dim); margin: 3px 0; }
  .ccard .cc-line a { color: var(--ink-dim); text-decoration: none; }
  .ccard .cc-line a:hover { color: var(--accent-ink); }
  .ccard .cc-steps { margin: 8px 0 0; padding-left: 18px; font-size: 14px; color: var(--ink-dim); }
  .ccard .cc-steps li { margin: 3px 0; }
  .ccard .cc-steps a { color: var(--accent-ink); }

  .lead-form { display: grid; gap: 12px; max-width: 440px; margin-top: 14px; }
  .lead-form label { font-size: 14px; font-weight: 700; color: var(--ink-dim); margin-bottom: -6px; }
  .lead-form input, .lead-form textarea { padding: 12px 14px; border-radius: var(--radius-sm); border: 1.5px solid var(--border); font-family: var(--font-body); font-size: 14.5px; background: var(--surface); color: var(--ink); width: 100%; }
  .lead-form textarea { min-height: 84px; resize: vertical; font-family: var(--font-body); }
  .lead-form input:focus, .lead-form textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .lead-form .btn-inline { justify-self: start; }
  .result p.form-success { font-weight: 700; color: var(--good); }
  .lead-note { font-size: 14px; color: var(--ink-faint); margin-top: 8px; }
  /* Ловушка для ботов: уводим за экран, а не display:none — часть ботов такие поля пропускает. */
  .hp-field { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }

  /* Кликабельна вся плашка, кнопка внутри — только визуальный акцент. */
  .restart-callout { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 26px 0 12px; padding: 24px 28px; border-radius: var(--radius-md); background: var(--surface-2); border: 1.5px solid var(--border); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease; }
  .restart-callout:hover { border-color: var(--border-strong); transform: translateY(-1px); box-shadow: 0 0 0 4px rgba(18,63,108,.12), 0 8px 24px -10px rgba(18,63,108,.55); }
  .restart-callout:hover .btn { background: var(--navy-2); box-shadow: 0 0 14px rgba(18,63,108,.45); }
  .restart-callout:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .restart-callout-icon { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--surface-3); color: var(--ink-dim); font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); }
  .restart-callout-text { flex: 1 1 260px; }
  .restart-callout-text b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--ink); margin-bottom: 4px; }
  .restart-callout-text p { margin: 0; font-size: 14px; color: var(--ink-dim); }
  .restart-callout .btn { flex: none; background: var(--navy); color: #fff; white-space: nowrap; transition: background .12s ease, box-shadow .12s ease; }
  @media (max-width: 620px) { .restart-callout { flex-direction: column; align-items: stretch; text-align: center; } .restart-callout-icon { margin: 0 auto; } .restart-callout .btn { width: 100%; } }

  .manager-callout { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 16px 0 12px; padding: 22px 26px; border-radius: var(--radius-md); background: var(--info-soft); border: 1.5px solid var(--info); }
  .manager-callout-text { flex: 1 1 260px; }
  .manager-callout-text b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; color: var(--info); margin-bottom: 4px; }
  .manager-callout-text p { margin: 0; font-size: 14px; color: var(--ink-dim); }
  .manager-callout .btn { flex: none; background: var(--navy); color: #fff; white-space: nowrap; }
  .manager-callout .btn:hover { background: var(--navy-2); }
  @media (max-width: 620px) { .manager-callout { flex-direction: column; align-items: stretch; text-align: center; } .manager-callout .btn { width: 100%; } }

  .register-callout { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; margin: 22px 0 12px; padding: 24px 28px; border-radius: var(--radius-md); background: var(--accent-soft); border: 1.5px solid var(--accent); cursor: pointer; text-decoration: none; color: inherit; transition: transform .12s ease, box-shadow .12s ease; }
  .register-callout:hover { transform: translateY(-1px); box-shadow: 0 0 0 4px rgba(255,115,34,.18), 0 8px 26px -8px rgba(255,115,34,.55); }
  .register-callout:focus-visible { outline: 2px solid var(--accent-ink); outline-offset: 2px; }
  .register-callout-text { flex: 1 1 260px; }
  .register-callout-text b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 17px; margin-bottom: 4px; color: var(--accent-ink); }
  .register-callout-text b::after, .restart-callout-text b::after { content: " →"; white-space: nowrap; }
  .register-callout-text p { margin: 0; font-size: 14px; color: var(--ink-dim); }
  .register-callout-text p.register-promo { margin-top: 6px; font-weight: 700; color: var(--accent-ink); }
  .register-callout .btn { flex: none; background: var(--accent); color: #fff; white-space: nowrap; transition: filter .12s ease, box-shadow .12s ease; }
  .register-callout:hover .btn, .register-callout .btn:hover { background: var(--accent); filter: brightness(1.12); box-shadow: 0 0 16px rgba(255,115,34,.6); }
  @media (max-width: 620px) { .register-callout { flex-direction: column; align-items: stretch; text-align: center; } .register-callout .btn { width: 100%; } }

  footer.page-footer { margin-top: 50px; padding-top: 20px; border-top: 1px solid var(--border); font-size: 14px; color: var(--ink-faint); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

  @media print {
    @page { margin: 12mm; }
    /* Заливку браузер печатает только с галочкой «Фоновая графика», поэтому цвет держим
       на рамках и тексте, а фон добавляем сверху — как бонус тем, у кого галочка включена. */
    body { background: #fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toc, .quiz-actions, .restart-callout, #sec-callback, #btn-pdf, .register-callout .btn, .topbar-tag { display: none !important; }
    /* Фирменная шапка с логотипом — вместо экранной, компактно и только на первой странице. */
    .topbar { display: block; border-bottom: 1px solid #d5d5d5; padding: 0 0 8px; margin: 0 0 12px; }
    .topbar-inner { padding: 0; }
    .brand img { height: 24px; }
    .wrap { padding: 0; }
    .result-layout { display: block; width: auto; margin: 0; }
    .quiz-shell { padding: 0; }
    /* Карточки разрешаем переносить: иначе целая карточка прыгает на новый лист и остаются дыры. */
    .result { box-shadow: none; border: 1px solid #d5d5d5; border-radius: 8px; padding: 14px 16px; }
    .res-section + .res-section { margin-top: 10px; }
    .result h2 { font-size: 17px; }
    .result h3 { font-size: 14px; }
    .result p, .result ul, .result li, .doc-desc, .sign-desc, .incl-item, .doc-app { font-size: 12.5px; }
    .result-eyebrow { font-size: 11px; margin-bottom: 4px; }
    .result h2, .result h3, .result-eyebrow, .doc-role-tag { break-after: avoid; page-break-after: avoid; }
    .doc-row, .sign-row, .incl-item, .ccard, .fact-chip, .doc-app { break-inside: avoid; page-break-inside: avoid; }
    /* Аккордеон и таблицы на экране обрезаны по рамке — в печати это резало содержимое. */
    details.acc { overflow: visible; break-inside: auto; }
    details.acc summary::after { display: none; }
    .table-scroll { overflow: visible; }
    table.money, table.tariff { min-width: 0; font-size: 12px; }
    table.money thead th { background: #faf7f5 !important; color: #53585f !important; }
    /* Тёмные плашки — светлыми: белый текст на непропечатанном фоне превратился бы в пустоту. */
    .promo-pack { background: #fff6ef !important; color: #16181b !important; border: 2px solid #ff7322; }
    .promo-pack-eyebrow, .result .promo-pack p { color: #53585f !important; }
    .promo-pack-gift { color: #b3450c !important; }
    .doc-badge { border: 1px solid #d5d5d5; }
    .register-callout { background: #fff6ef !important; border: 2px solid #ff7322; page-break-inside: avoid; }
    /* На бумаге кликнуть нельзя — печатаем адрес рядом. */
    .register-callout::after { content: "epd.platformaofd.ru"; font-weight: 700; color: #b3450c; }
    .incl-sum-title { font-size: 14px; }
    a { text-decoration: none; }
  }

  @media (max-width: 620px) {
    .result { padding: 22px 18px; }
    .toggle-row { flex-direction: column; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  // =====================================================================
  // ОТПРАВКА ЗАЯВОК
  //
  // Единственная строка, которая привязывает квиз к конкретному приёмнику.
  // Сюда вставляется адрес /exec из Apps Script (см. инструменты/lead-api/README.md).
  // Заменить приёмник (Яндекс, свой сервер, CRM подрядчика) = поменять эту строку:
  // формат заявки ниже не меняется, ответ сервера страница не читает.
  // Пустая строка = отправка выключена, квиз работает как раньше.
  // =====================================================================
  var LEAD_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwuMz-JF33QcHwgWUoYmODp5NcyJV_GW0o4mbZ3lJBTvo8MnzIzh4korI6ZAbS_B8krsw/exec';
  var LEAD_PAGE = 'прод';

  function newLeadSession() {
    return {
      id: String(Date.now()) + '-' + Math.random().toString(36).slice(2, 8),
      openedAt: Date.now()
    };
  }

  var leadSession = newLeadSession();

  // Скрытое поле-ловушка: человек его не видит, бот заполняет.
  var HONEYPOT_HTML = '<div class="hp-field" aria-hidden="true">' +
    '<label for="hp-company-site">Сайт компании</label>' +
    '<input type="text" id="hp-company-site" name="company_site" tabindex="-1" autocomplete="off"></div>';

  var POLUCHATEL_OPTIONS = [
    { v: 'fizlico', t: 'Как физлицо', closed: 'ЭПД — документооборот между компаниями и ИП. Человеку, получающему груз для себя, он не нужен.' },
    { v: 'ul', t: 'Как компания или ИП' }
  ];

  var YES_NO_OPTIONS = [ { v: 'yes', t: 'Да' }, { v: 'no', t: 'Нет' } ];

  var EKSP_VLADENIE_OPTIONS = [
    { v: 'yes', t: 'Экспедитор берёт груз во владение' },
    { v: 'no', t: 'Не берёт' }
  ];

  function optionOf(options, value) {
    for (var i = 0; i < options.length; i++) { if (options[i].v === value) return options[i]; }
    return {};
  }

  function numLine(label, value) {
    return { label: label, value: String(value || 0) };
  }

  // Расшифровка ответов собирается на странице: приёмнику не нужно знать логику квиза,
  // поэтому любой новый приёмник подключается без переписывания словарей.
  // Берём только отмеченные роли, способы и видимые поля: после «Назад» в state могут
  // остаться числа, которых клиент уже не видит, и менеджеру они уехать не должны.
  function buildLeadSummary() {
    var a = state.answers;
    var out = [];
    var needed = ROLE_ORDER.filter(roleNeeded).map(function (r) { return ROLE_NAMES[r]; });
    if (needed.length) out.push({ label: 'Роли', value: needed.join(', ') });
    closedReasons().forEach(function (c) {
      out.push({ label: 'ЭПД не нужен: ' + c.who, value: c.text });
    });
    if (state.roles.has('otpravitel')) {
      var o = a.otpravitel;
      var ways = [];
      if (o.self.on) ways.push('своей машиной');
      if (o.naem.on) ways.push('через перевозчика');
      if (o.eksp.on) ways.push('через экспедитора');
      out.push({ label: 'Отправитель: как возит', value: ways.join(', ') });
      if (o.self.on) out.push(numLine('Отправитель: рейсов с алкоголем своей машиной в месяц', o.self.alk));
      if (o.naem.on) {
        out.push(numLine('Отправитель: рейсов через перевозчика в месяц', o.naem.reysy));
        out.push(numLine('Отправитель: точек доставки в рейсе через перевозчика', o.naem.tochek));
      }
      if (o.eksp.on) {
        out.push({ label: 'Отправитель: экспедитор берёт груз во владение', value: o.eksp.vladenie === 'yes' ? 'да' : 'нет' });
        out.push(numLine('Отправитель: поручений экспедитору в месяц', o.eksp.porucheniy));
        if (o.eksp.vladenie === 'no') out.push(numLine('Отправитель: точек доставки в рейсе через экспедитора', o.eksp.tochek));
      }
    }
    if (state.roles.has('perevozchik')) {
      out.push(numLine('Перевозчик: точек доставки компаниям и ИП в месяц', a.perevozchik.tochek));
      out.push(numLine('Перевозчик: рейсов с алкоголем в месяц', a.perevozchik.alk));
    }
    if (state.roles.has('poluchatel')) {
      out.push({ label: 'Получатель: как получает грузы', value: optionOf(POLUCHATEL_OPTIONS, a.poluchatel.kak).t || '' });
    }
    if (state.roles.has('ekspeditor')) {
      var e = a.ekspeditor;
      out.push({ label: 'Экспедитор: берёт груз во владение', value: e.vladenie === 'yes' ? 'да' : 'нет' });
      if (e.vladenie === 'yes') {
        out.push(numLine('Экспедитор: поручений с владением грузом в месяц', e.porucheniy));
        out.push(numLine('Экспедитор: из них с хранением на складе', e.sklad));
        out.push(numLine('Экспедитор: точек доставки в рейсе', e.tochek));
      }
    }
    out.push({ label: 'Подписывают наёмные сотрудники', value: hasHiredPeople() ? 'да' : 'нет' });
    out.push({ label: 'Какие подписи подойдут', value: signLines().map(function (line) { return line.title; }).join('; ') });
    return out;
  }

  function buildLeadCalc(totals) {
    var cards = signLines();
    return {
      rows: totals.rows,
      totalMonthly: totals.totalMonthly,
      totalAnnual: totals.totalAnnual,
      tariff: { docs: totals.tariff.docs, price: totals.tariff.price, perDoc: totals.tariff.perDoc, giftDocs: totals.gift },
      signature: cards.map(function (c) { return c.key; }).join(', '),
      signatureTitle: cards.map(function (c) { return c.title; }).join('; ')
    };
  }

  // Сырые ответы — только по отмеченным ролям, чтобы в заявку не попали ответы снятой роли.
  function selectedAnswers() {
    var out = {};
    ROLE_ORDER.forEach(function (role) { if (state.roles.has(role)) out[role] = state.answers[role]; });
    out.hasEmployees = state.hasEmployees;
    return out;
  }

  function buildLeadPayload(type, contactExtra) {
    var contact = {
      phone: state.contact.phone || '',
      email: state.contact.email || '',
      name: '',
      inn: ''
    };
    if (contactExtra) {
      Object.keys(contactExtra).forEach(function (key) {
        if (contactExtra[key]) contact[key] = contactExtra[key];
      });
    }
    // state.roles — это Set, и JSON.stringify превратил бы его в {}.
    var roles = [];
    var rolesText = [];
    ROLE_ORDER.forEach(function (role) {
      if (!state.roles.has(role)) return;
      roles.push(role);
      rolesText.push(ROLE_NAMES[role] + (roleNeeded(role) ? '' : ' (ЭПД не нужен)'));
    });
    var honeypot = document.querySelector('input[name="company_site"]');
    var totals = calcTotals();
    var calc = buildLeadCalc(totals);
    var summary = buildLeadSummary();
    // Менеджер должен называть тот же объём, что клиент видел в расчёте.
    if (totals.overflow) {
      summary.push({ label: 'Объём', value: 'Больше самого большого пакета — клиент видел плашку про индивидуальный тариф' });
    } else if (calc.tariff.giftDocs) {
      summary.push({ label: 'Акция к 10-летию', value: '+' + fmt(calc.tariff.giftDocs) + ' документов в подарок, пакет ' +
        fmt(calc.tariff.docs) + ' → ' + fmt(calc.tariff.docs + calc.tariff.giftDocs) });
    }
    return {
      type: type,
      sessionId: leadSession.id,
      contact: contact,
      roles: roles,
      rolesText: rolesText.join(', '),
      summary: summary,
      answers: selectedAnswers(),
      calc: calc,
      meta: {
        page: LEAD_PAGE,
        url: location.href,
        ts: new Date().toISOString(),
        formTimeSec: Math.round((Date.now() - leadSession.openedAt) / 1000)
      },
      company_site: honeypot ? honeypot.value : ''
    };
  }

  // Отправка «выстрелил и забыл»: mode no-cors + text/plain — это простой запрос,
  // он уходит с любого домена без CORS-заголовков на приёмнике. Ответ не читаем,
  // ошибки гасим: показ расчёта не должен зависеть от того, жив ли приёмник.
  function sendLead(type, contactExtra) {
    if (!LEAD_ENDPOINT) return;
    var payload;
    try {
      payload = buildLeadPayload(type, contactExtra);
    } catch (err) {
      return;
    }
    try {
      fetch(LEAD_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        keepalive: true,
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (err) {
      /* отправка никогда не мешает работе квиза */
    }
  }

  var ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>';

  var TARIFF = [
    { docs: 100, price: 1000, perDoc: '10 ₽' },
    { docs: 500, price: 3000, perDoc: '6 ₽' },
    { docs: 1000, price: 5000, perDoc: '5 ₽' },
    { docs: 5000, price: 20000, perDoc: '4 ₽' },
    { docs: 10000, price: 35000, perDoc: '3,5 ₽' },
    { docs: 50000, price: 150000, perDoc: '3 ₽' },
    { docs: 100000, price: 250000, perDoc: '2,5 ₽' }
  ];

  function fmt(n) { return n.toLocaleString('ru-RU'); }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var TARIFF_RECOMMEND = [
    { from: 0, tier: TARIFF[0] },      // 100
    { from: 100, tier: TARIFF[1] },    // 500
    { from: 650, tier: TARIFF[2] },    // 1 000
    { from: 3500, tier: TARIFF[3] },   // 5 000
    { from: 8000, tier: TARIFF[4] },   // 10 000
    { from: 40000, tier: TARIFF[5] },  // 50 000
    { from: 80000, tier: TARIFF[6] }   // 100 000
  ];

  function recommendTariff(annualDocs) {
    var picked = TARIFF_RECOMMEND[0].tier;
    for (var i = 0; i < TARIFF_RECOMMEND.length; i++) {
      if (annualDocs >= TARIFF_RECOMMEND[i].from) picked = TARIFF_RECOMMEND[i].tier;
    }
    return picked;
  }

  // Акция к 10-летию компании: к любому пакету +20% документов, цена та же.
  // Дату окончания клиентам не показываем, но после неё всё про акцию пропадает само:
  // 01.01.2027 00:00 по Москве = 31.12.2026 21:00 UTC.
  var PROMO_ENDS_AT = Date.UTC(2026, 11, 31, 21, 0, 0);
  var PROMO_GIFT_SHARE = 0.2;

  function promoActive() {
    return Date.now() < PROMO_ENDS_AT;
  }

  function promoGiftDocs(tier) {
    return promoActive() ? Math.round(tier.docs * PROMO_GIFT_SHARE) : 0;
  }

  // Цена за документ с учётом подарка: пакет и цена те же, документов больше.
  function perDocWithGift(tier) {
    var gift = promoGiftDocs(tier);
    if (!gift) return '';
    return (tier.price / (tier.docs + gift)).toLocaleString('ru-RU', { maximumFractionDigits: 2 }) + ' ₽';
  }

  // Самый большой пакет с подарком — 120 000 документов в год. Больше этого объёма
  // стандартных пакетов уже не хватает, такой клиент идёт к менеджеру за индивидуальным тарифом.
  function maxCoveredDocs() {
    var maxTier = TARIFF[TARIFF.length - 1];
    return maxTier.docs + promoGiftDocs(maxTier);
  }

  // Подарок — это документы к пакету: тому, кто документы не отправляет, он не нужен,
  // поэтому на шаге контактов и в плашке регистрации про него молчим. В полной таблице
  // тарифов подарок виден всем — цены там одинаковые для всех (решение Маши, 23.09.2026).
  function showsPromoGift() {
    return promoActive() && hasPaidRole();
  }

  // ---------------------------------------------------------------------
  // STATE
  // ---------------------------------------------------------------------
  // Пустое поле хранится как null, чтобы «ещё не заполнено» не путалось с честным нулём.
  // Точки доставки по умолчанию 1, рейсы с алкоголем у перевозчика и хранение — 0.
  function emptyRoleAnswers() {
    return {
      otpravitel: {
        self: { on: false, alk: 0 },
        naem: { on: false, reysy: null, tochek: 1 },
        eksp: { on: false, vladenie: null, porucheniy: null, tochek: 1 }
      },
      perevozchik: { tochek: null, alk: 0 },
      poluchatel: { kak: null },
      ekspeditor: { vladenie: null, porucheniy: null, sklad: 0, tochek: 1 }
    };
  }

  function freshState() {
    return {
      started: false,
      roles: new Set(),
      answers: emptyRoleAnswers(),
      hasEmployees: null,
      contact: { phone: '', email: '' },
      showResult: false
    };
  }

  var state = freshState();

  var ROLE_ORDER = ['otpravitel', 'perevozchik', 'poluchatel', 'ekspeditor'];

  // Идентификаторы экранов ролей совпадают с ключами ролей.
  var STEP_IDS = ['roles', 'otpravitel', 'perevozchik', 'poluchatel', 'ekspeditor', 'sign', 'leadGate'];

  // При повторном выборе роли её прошлые ответы стираем, чтобы экран открылся чистым.
  function resetRole(role) {
    state.answers[role] = emptyRoleAnswers()[role];
  }

  // ---------------------------------------------------------------------
  // DOCUMENT COUNTS
  // ---------------------------------------------------------------------
  function num(v) { return v || 0; }

  function sumValues(obj) {
    return Object.keys(obj).reduce(function (s, k) { return s + obj[k]; }, 0);
  }

  // Точки доставки спрашиваем внутри способа, поэтому у найма и у экспедитора свои числа.
  function otpEkspTochekVisible() {
    var o = state.answers.otpravitel;
    return o.eksp.on && o.eksp.vladenie === 'no';
  }

  // Документы в месяц по каждому способу. Неотмеченный способ, снятая роль и скрытое поле
  // дают ноль: после «Назад» в state могут остаться числа, которых клиент уже не видит.
  function otpCounts() {
    var c = { selfEpl: 0, naemEzz: 0, naemEtrn: 0, ekspEpe: 0, ekspEzz: 0, ekspEtrn: 0 };
    if (!state.roles.has('otpravitel')) return c;
    var o = state.answers.otpravitel;
    if (o.self.on) c.selfEpl = num(o.self.alk);
    if (o.naem.on) {
      c.naemEzz = num(o.naem.reysy);
      c.naemEtrn = c.naemEzz * num(o.naem.tochek);
    }
    if (o.eksp.on) {
      c.ekspEpe = num(o.eksp.porucheniy);
      // Экспедитор без владения только находит перевозчика: заявку и накладные оформляет отправитель.
      // Упрощение: про рейсы не спрашиваем, считаем один рейс на поручение.
      if (o.eksp.vladenie === 'no') {
        c.ekspEzz = num(o.eksp.porucheniy);
        c.ekspEtrn = c.ekspEzz * num(o.eksp.tochek);
      }
    }
    return c;
  }

  function perevCounts() {
    if (!state.roles.has('perevozchik')) return { etrn: 0, epl: 0 };
    var p = state.answers.perevozchik;
    return { etrn: num(p.tochek), epl: num(p.alk) };
  }

  function ekspOwns() {
    var e = state.answers.ekspeditor;
    return state.roles.has('ekspeditor') && e.vladenie === 'yes' && num(e.porucheniy) > 0;
  }

  // Экспедитор с владением сам выступает грузоотправителем: кроме расписок у него заявки и накладные.
  // Упрощение: про рейсы отдельно не спрашиваем, считаем один рейс на поручение.
  function ekspCounts() {
    if (!ekspOwns()) return { eer: 0, esr: 0, ezz: 0, etrn: 0 };
    var e = state.answers.ekspeditor;
    var ezz = num(e.porucheniy);
    return { eer: ezz, esr: num(e.sklad), ezz: ezz, etrn: ezz * num(e.tochek) };
  }

  // Роль нужна, если по ней есть документы — платные или бесплатные с доступом к сервису.
  // Экспедитору ЭПД нужен всегда: даже без владения он подписывает поручение.
  function roleNeeded(role) {
    if (!state.roles.has(role)) return false;
    if (role === 'otpravitel') return sumValues(otpCounts()) > 0;
    if (role === 'perevozchik') return sumValues(perevCounts()) > 0;
    if (role === 'poluchatel') return state.answers.poluchatel.kak === 'ul';
    return true;
  }

  function allRolesExcluded() {
    return state.roles.size > 0 && !ROLE_ORDER.some(roleNeeded);
  }

  var CLOSED_TEXT = {
    otpSelf: 'Везёте сами, без найма перевозчика — транспортная накладная не нужна: она оформляется именно при найме. Алкоголь вы не возите, значит и электронный путевой лист не нужен.',
    otpNaem: 'Рейсы физлицам и себе на склад ЭПД не требуют. Физлицу электронные документы не нужны, а для перевозки на свой склад действует исключение (приказ Минтранса № 262). Норма временная — уточняйте у менеджера, не изменилась ли.',
    otpEksp: 'Поручения физлицам ЭПД не требуют, а поручение себе на склад нужно, только если экспедитор берёт груз во владение.',
    perevozchik: 'ЭПД нужен только для перевозок компаниям и ИП, доставка физлицам сюда не попадает. Алкоголь вы не возите, значит и электронный путевой лист не нужен.'
  };

  // Причины по закрытым способам и ролям — для шапки результата, экрана «ЭПД не понадобится» и заявки.
  function closedReasons() {
    var out = [];
    var a = state.answers;
    if (state.roles.has('otpravitel')) {
      var c = otpCounts();
      if (a.otpravitel.self.on && !c.selfEpl) out.push({ who: 'Отправитель, своей машиной', text: CLOSED_TEXT.otpSelf });
      if (a.otpravitel.naem.on && !c.naemEzz) out.push({ who: 'Отправитель, через перевозчика', text: CLOSED_TEXT.otpNaem });
      if (a.otpravitel.eksp.on && !c.ekspEpe && !c.ekspEzz) out.push({ who: 'Отправитель, через экспедитора', text: CLOSED_TEXT.otpEksp });
    }
    if (state.roles.has('perevozchik') && !roleNeeded('perevozchik')) {
      out.push({ who: 'Перевозчик', text: CLOSED_TEXT.perevozchik });
    }
    if (state.roles.has('poluchatel') && !roleNeeded('poluchatel')) {
      out.push({ who: 'Получатель', text: optionOf(POLUCHATEL_OPTIONS, a.poluchatel.kak).closed || '' });
    }
    return out;
  }

  // ---------------------------------------------------------------------
  // NAVIGATION
  // ---------------------------------------------------------------------
  function stepVisible(id) {
    switch (id) {
      case 'roles': return true;
      case 'otpravitel':
      case 'perevozchik':
      case 'poluchatel':
      case 'ekspeditor': return state.roles.has(id);
      case 'sign':
      case 'leadGate': return !allRolesExcluded();
      default: return false;
    }
  }

  var stepHistory = [];
  var currentId = null;

  function firstVisibleFrom(startIdx) {
    for (var i = startIdx; i < STEP_IDS.length; i++) { if (stepVisible(STEP_IDS[i])) return STEP_IDS[i]; }
    return null;
  }

  function goToStep(id) {
    currentId = id;
    render();
  }

  function advance() {
    var idx = STEP_IDS.indexOf(currentId);
    var next = firstVisibleFrom(idx + 1);
    stepHistory.push(currentId);
    if (next) {
      goToStep(next);
    } else {
      state.showResult = true;
      render();
    }
    window.scrollTo({ top: 0 });
  }

  function goBack() {
    if (state.showResult) { state.showResult = false; goToStep(currentId); return; }
    var prev = stepHistory.pop();
    if (prev) { goToStep(prev); }
    else { state.started = false; render(); }
  }

  // Печать в PDF: раскрываем аккордеоны, иначе в файл не попадёт то, что человек мог развернуть.
  // Сам PDF делает браузер («Сохранить как PDF» в диалоге печати) — ссылки в нём остаются кликабельными.
  function printResult() {
    var closed = [].slice.call(document.querySelectorAll('details.acc:not([open])'));
    closed.forEach(function (d) { d.open = true; });
    var restored = false;
    function restore() {
      if (restored) return;
      restored = true;
      closed.forEach(function (d) { d.open = false; });
      window.removeEventListener('afterprint', restore);
    }
    window.addEventListener('afterprint', restore);
    window.print();
    setTimeout(restore, 1000);
  }

  // Плашка «пройти заново» — не кнопка, поэтому клавиатуру обрабатываем руками.
  function wireRestart() {
    var box = document.getElementById('btn-restart');
    if (!box) return;
    box.addEventListener('click', restart);
    box.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); restart(); }
    });
  }

  function restart() {
    state = freshState();
    stepHistory = []; currentId = null;
    leadSession = newLeadSession();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------------------------------------------------------------------
  // TRAIL (roles you're answering — current role highlighted, answered ones checked)
  // ---------------------------------------------------------------------
  function roleStatus(role) {
    if (state.showResult) return 'done';
    var roleIdx = STEP_IDS.indexOf(role);
    var idx = STEP_IDS.indexOf(currentId);
    if (idx > roleIdx) return 'done';
    if (idx === roleIdx) return 'active';
    return 'upcoming';
  }

  function trailHtml() {
    if (!state.roles.size) return '';
    var chips = ROLE_ORDER.filter(function (r) { return state.roles.has(r); }).map(function (r) {
      var status = roleStatus(r);
      var cls = 'role-chip' + (status === 'active' ? ' active' : '') + (status === 'done' ? ' done' : '');
      if (status === 'done' && !roleNeeded(r)) cls += ' excluded';
      var mark = status === 'done' ? ICON_CHECK : '';
      return '<span class="' + cls + '">' + mark + '<span>' + ROLE_NAMES[r] + '</span></span>';
    }).join('');
    if (state.hasEmployees && STEP_IDS.indexOf(currentId) > STEP_IDS.indexOf('sign')) {
      var signText = hasHiredPeople() ? 'Подписывают сотрудники' : 'Подписывает сам';
      chips += '<span class="role-chip done">' + ICON_CHECK + '<span>' + signText + '</span></span>';
    }
    return '<div class="trail">' + chips + '</div>';
  }

  // ---------------------------------------------------------------------
  // MONEY CALCULATION
  // ---------------------------------------------------------------------
  // parts — пары [сколько, сокращение]; нулевые документы в разбивку не пишем.
  function pushRow(rows, key, role, parts) {
    var total = parts.reduce(function (s, p) { return s + p[0]; }, 0);
    if (!total) return;
    rows.push({
      key: key,
      role: role,
      docsPerMonth: total,
      detail: parts.filter(function (p) { return p[0] > 0; }).map(function (p) { return fmt(p[0]) + ' ' + p[1]; }).join(' + ')
    });
  }

  // Строки с нулём не показываем: бесплатные роли видны в блоке «Ваши документы».
  function computeRoleRows() {
    var rows = [];
    var o = otpCounts();
    var p = perevCounts();
    var e = ekspCounts();
    pushRow(rows, 'otpravitel-self', 'Грузоотправитель — своей машиной', [[o.selfEpl, 'ЭПЛ']]);
    pushRow(rows, 'otpravitel-naem', 'Грузоотправитель — через перевозчика', [[o.naemEzz, 'ЭЗЗ'], [o.naemEtrn, 'ЭТрН']]);
    pushRow(rows, 'otpravitel-eksp', 'Грузоотправитель — через экспедитора', [[o.ekspEpe, 'ЭПЭ'], [o.ekspEzz, 'ЭЗЗ'], [o.ekspEtrn, 'ЭТрН']]);
    pushRow(rows, 'perevozchik', 'Перевозчик', [[p.etrn, 'ЭТрН'], [p.epl, 'ЭПЛ']]);
    pushRow(rows, 'ekspeditor', 'Экспедитор (с владением грузом)', [[e.eer, 'ЭЭР'], [e.esr, 'ЭСР'], [e.ezz, 'ЭЗЗ'], [e.etrn, 'ЭТрН']]);
    return rows;
  }

  // Единственное место, где считается объём и подбирается пакет. Им пользуются и экран
  // расчёта, и заявка менеджеру — иначе клиент и менеджер легко увидят разные числа.
  // pushRow() не добавляет строку с нулём, поэтому «есть платные документы» = есть строки.
  function calcTotals() {
    var rows = computeRoleRows();
    var totalMonthly = rows.reduce(function (sum, row) { return sum + row.docsPerMonth; }, 0);
    var totalAnnual = totalMonthly * 12;
    var tariff = recommendTariff(totalAnnual);
    var hasPaid = rows.length > 0;
    return {
      rows: rows,
      totalMonthly: totalMonthly,
      totalAnnual: totalAnnual,
      tariff: tariff,
      hasPaid: hasPaid,
      gift: hasPaid ? promoGiftDocs(tariff) : 0,
      overflow: hasPaid && totalAnnual > maxCoveredDocs()
    };
  }

  function hasPaidRole() {
    return calcTotals().hasPaid;
  }

  // Вопроса «сам за рулём или наёмные водители» больше нет: о сотрудниках судим по тому,
  // кто подписывает, и по ролям, где обычно работают водители и логисты.
  function onlyReceiver() {
    var needed = ROLE_ORDER.filter(roleNeeded);
    return needed.length === 1 && needed[0] === 'poluchatel';
  }
  function hasHiredPeople() {
    return state.hasEmployees === 'yes';
  }

  // ---------------------------------------------------------------------
  // RENDER: START SCREEN
  // ---------------------------------------------------------------------
  function renderStart() {
    var app = document.getElementById('app');
    app.innerHTML =
      '<div class="hero">' +
      (promoActive() ? '<div class="promo-hero"><div class="promo-hero-num">10</div><div>' +
        '<div class="promo-hero-label">лет компании</div>' +
        '<div class="promo-hero-text">+20% документов в подарок к любому пакету</div></div></div>' : '') +
      '<div class="eyebrow">Расчёт за 5 минут</div>' +
      '<h1>Нужны ли вам электронные перевозочные документы?</h1>' +
      '<p class="lead">Ответьте на несколько вопросов — покажем, нужен ли вам ЭПД, какие документы подписывать, сколько это стоит в год и как оформиться. Только то, что касается вас.</p>' +
      '<div class="hero-points">' +
      '<div class="hero-point">' + ICON_CHECK + '<span>Посчитаем документы и сумму в год</span></div>' +
      '<div class="hero-point">' + ICON_CHECK + '<span>Подскажем, какая подпись нужна вам</span></div>' +
      '<div class="hero-point">' + ICON_CHECK + '<span>В каких ситуациях ЭПД вам НЕ обязательно</span></div>' +
      '</div>' +
      '<button class="btn btn-primary" id="btn-start">' + (promoActive() ? 'Рассчитать пакет с подарком →' : 'Начать расчёт →') + '</button>' +
      '</div>';
    document.getElementById('btn-start').addEventListener('click', function () {
      state.started = true;
      currentId = 'roles';
      render();
    });
  }

  // ---------------------------------------------------------------------
  // GENERIC QUIZ SHELL
  // ---------------------------------------------------------------------
  function quizShell(innerHtml, opts) {
    opts = opts || {};
    // Подпись и контакты считаем всегда: пока роли не заполнены, неизвестно, понадобятся ли они,
    // а полоса, которая прыгает назад, выглядит как ошибка.
    var planned = STEP_IDS.filter(function (id) { return id === 'sign' || id === 'leadGate' || stepVisible(id); });
    var pos = planned.indexOf(currentId);
    var pct = Math.min(100, Math.round(((pos + 1) / (planned.length + 1)) * 100));
    return '<div class="quiz-shell">' +
      '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      trailHtml() +
      innerHtml +
      '<div class="quiz-actions">' +
      '<button class="btn btn-ghost" id="btn-back">← Назад</button>' +
      (opts.hideNext ? '' : '<button class="btn btn-primary" id="btn-next">' + (opts.nextLabel || 'Далее →') + '</button>') +
      '</div>' +
      '</div>';
  }

  function wireBack() {
    var b = document.getElementById('btn-back');
    if (b) b.addEventListener('click', goBack);
  }

  // ---------------------------------------------------------------------
  // FORM HELPERS
  // ---------------------------------------------------------------------
  function numFieldHtml(f) {
    return '<div class="num-field">' +
      '<label for="' + f.id + '">' + f.label + '</label>' +
      '<input type="number" inputmode="numeric" min="' + (f.min || 0) + '" step="1" id="' + f.id + '" class="num-input"' +
      (f.placeholder ? ' placeholder="' + f.placeholder + '"' : '') + ' value="' + (f.value === null ? '' : f.value) + '">' +
      (f.note ? '<div class="num-note">' + f.note + '</div>' : '') +
      '</div>';
  }

  // Пустое поле — null. Дробь и минус тоже null, а sync() покажет, что не так.
  function readNum(input) {
    var raw = input.value.trim();
    return /^\d+$/.test(raw) ? parseInt(raw, 10) : null;
  }

  function choiceHtml(id, options, value, extraClass) {
    return '<div class="opt-list' + (extraClass ? ' ' + extraClass : '') + '" id="' + id + '">' +
      options.map(function (o) {
        return '<button type="button" class="opt-btn" data-value="' + o.v + '" aria-pressed="' + (value === o.v ? 'true' : 'false') + '">' +
          '<span><span class="opt-title">' + o.t + '</span>' + (o.d ? '<span class="opt-desc">' + o.d + '</span>' : '') + '</span></button>';
      }).join('') + '</div>';
  }

  function wireChoice(id, onPick) {
    var buttons = document.querySelectorAll('#' + id + ' .opt-btn');
    buttons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        buttons.forEach(function (b) { b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'); });
        onPick(btn.getAttribute('data-value'));
      });
    });
  }

  // Строка-способ: галочка сверху, поля ниже. Поля лежат вне <label>, иначе клик по полю
  // переключал бы галочку.
  function methodHtml(id, title, on, bodyHtml, desc) {
    return '<div class="method' + (on ? ' checked' : '') + '" id="' + id + '">' +
      '<label class="check-item"><input type="checkbox"' + (on ? ' checked' : '') + '>' +
      '<span><span class="ci-title">' + title + '</span>' +
      (desc ? '<span class="ci-desc">' + desc + '</span>' : '') + '</span></label>' +
      '<div class="method-body" id="' + id + '-body"' + (on ? '' : ' hidden') + '>' + bodyHtml + '</div>' +
      '</div>';
  }

  function wireMethod(id, flag, sync) {
    var box = document.getElementById(id);
    var input = box.querySelector('input[type="checkbox"]');
    input.addEventListener('change', function () {
      flag.on = input.checked;
      box.classList.toggle('checked', flag.on);
      document.getElementById(id + '-body').hidden = !flag.on;
      sync();
    });
  }

  var TOCHEK_MIN_ERROR = 'Точек доставки на рейс — не меньше одной.';

  // Экран с полями. При вводе ничего не перерисовываем, иначе слетал бы фокус: sync() прячет
  // лишние блоки и включает «Далее». check() возвращает null — можно дальше, '' — ещё
  // не заполнено (молча), строку — ошибку, которую надо показать.
  var FILL_FIELDS_ERROR = 'Чтобы продолжить, заполните выделенные поля.';

  function markInvalid(id) {
    var el = document.getElementById(id);
    if (!el) return;
    var field = el.closest ? el.closest('.num-field') : null;
    (field || el).classList.add('invalid');
  }

  function clearInvalid() {
    [].slice.call(document.querySelectorAll('.invalid')).forEach(function (el) { el.classList.remove('invalid'); });
  }

  // К первому незаполненному: в поле ставим курсор, к группе вариантов просто прокручиваем.
  function focusInvalid(id) {
    var el = document.getElementById(id);
    if (!el) return;
    if (el.tagName === 'INPUT') { el.focus(); return; }
    if (el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // cfg.check() — ошибки, которые видно сразу (несочетаемые числа).
  // cfg.missing() — список ещё не заполненных полей; ругаемся на них только после «Далее»,
  // чтобы человек не видел красного, пока не начал отвечать.
  function mountForm(inner, cfg) {
    document.getElementById('app').innerHTML = quizShell(inner + '<p class="form-error" id="form-error" role="alert"></p>');
    wireBack();
    var next = document.getElementById('btn-next');
    var errorEl = document.getElementById('form-error');
    var numbers = cfg.numbers || [];
    var attempted = false;
    var blocked = true;
    var firstMissing = null;

    function sync() {
      (cfg.show || []).forEach(function (s) { document.getElementById(s.id).hidden = !s.when(); });
      var badNumber = numbers.some(function (f) {
        var input = document.getElementById(f.id);
        if (input.closest('[hidden]')) return false;
        return input.validity.badInput || (input.value.trim() !== '' && readNum(input) === null);
      });
      var hard = badNumber ? 'Введите целое число — без дробей и минуса.' : (cfg.check ? cfg.check() : null);
      var miss = cfg.missing ? cfg.missing() : {};
      var ids = miss.ids || [];
      firstMissing = ids[0] || null;
      blocked = !!hard || ids.length > 0;
      clearInvalid();
      if (attempted) ids.forEach(markInvalid);
      errorEl.textContent = hard || (attempted && ids.length ? (miss.message || FILL_FIELDS_ERROR) : '');
    }

    numbers.forEach(function (f) {
      var input = document.getElementById(f.id);
      input.addEventListener('input', function () { f.set(readNum(input)); sync(); });
    });
    next.addEventListener('click', function () {
      attempted = true;
      sync();
      if (!blocked) { advance(); return; }
      if (firstMissing) focusInvalid(firstMissing);
    });
    sync();
    return sync;
  }

  function renderMoneySection(headHtml) {
    var totals = calcTotals();
    var rows = totals.rows;
    var totalMonthly = totals.totalMonthly;
    var totalAnnual = totals.totalAnnual;
    var hasPaid = totals.hasPaid;
    var overflow = totals.overflow;
    var picked = totals.tariff;

    var bodyHtml = '';
    if (hasPaid) {
      bodyHtml += '<div class="table-scroll"><table class="money"><thead><tr><th>Роль</th><th>Как считали</th><th>Документов</th></tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td>' + r.role + '</td><td>' + r.detail + '</td><td class="num">' + fmt(r.docsPerMonth) + ' в месяц</td></tr>'; }).join('') +
        '</tbody><tfoot><tr><td colspan="2">Итого</td><td class="num">' + fmt(totalMonthly) + ' в месяц / ' + fmt(totalAnnual) + ' в год</td></tr></tfoot></table></div>';

      var gift = totals.gift;
      if (overflow) {
        // Цену самого большого пакета показываем и таким клиентам — от неё менеджер и считает.
        bodyHtml += gift
          ? renderPromoPack(picked, gift, totalMonthly, totalAnnual, true)
          : '<div class="big-number">' + fmt(picked.price) + ' ₽</div>' +
            '<p>Это самый большой стандартный пакет — <b>' + fmt(picked.docs) + ' документов</b> (по ' + picked.perDoc + ' за документ).</p>';
        bodyHtml += renderBigVolumeCallout(totalAnnual);
      } else if (gift) {
        bodyHtml += renderPromoPack(picked, gift, totalMonthly, totalAnnual);
      } else if (picked.docs >= totalAnnual) {
        bodyHtml += '<div class="big-number">' + fmt(picked.price) + ' ₽ <span>/ год</span></div>' +
          '<p>Пакет — <b>' + fmt(picked.docs) + ' документов в год</b> (по ' + picked.perDoc + ' за документ), хватит на весь год.</p>';
      } else {
        var months = Math.max(1, Math.floor(picked.docs / totalMonthly));
        bodyHtml += '<div class="big-number">' + fmt(picked.price) + ' ₽</div>' +
          '<p>Пакет — <b>' + fmt(picked.docs) + ' документов</b> (по ' + picked.perDoc + ' за документ), хватит примерно на ' + months + ' мес. из 12 при вашем темпе. Закончится — купите ещё такой же.</p>';
      }

      // Большому объёму плашка уже показана выше вместо цены, остальным — про возможные акции.
      if (!overflow && totalAnnual >= 20000) {
        bodyHtml += '<div class="callout info"><b>Возможны специальные условия.</b> Бывают акции для такого объёма. Например: подключаетесь вместе со своими перевозчиками, оставляете публичный отзыв или разрешаете использовать логотип компании — можно обсудить скидку. ' + managerLink() + '</div>';
      }
    } else {
      bodyHtml += '<div class="big-number">1 000 ₽ <span>/ год</span></div>' +
        '<p>Среди ваших ролей нет платных — платите только минимальный доступ, без оплаты за документы.</p>';
    }

    bodyHtml += renderIncludedSection();

    // Пока идёт акция, в таблице стоят обе величины сразу: зачёркнутая обычная и рядом с подарком.
    var showGift = promoActive();
    bodyHtml += '<details class="acc"><summary>Полная таблица тарифов</summary><div class="acc-body">' +
      '<div class="table-scroll"><table class="tariff"><thead><tr><th>Пакет документов</th><th>Цена</th><th>Цена за 1 документ</th></tr></thead><tbody>' +
      TARIFF.map(function (row) {
        var cls = row === picked ? ' class="hit"' : '';
        var docs = showGift
          ? '<s>' + fmt(row.docs) + '</s> <b>' + fmt(row.docs + promoGiftDocs(row)) + '</b>'
          : fmt(row.docs);
        var perDoc = showGift
          ? '<s>' + row.perDoc + '</s> <b>' + perDocWithGift(row) + '</b>'
          : row.perDoc;
        return '<tr' + cls + '><td class="num">' + docs + '</td>' +
          '<td>' + fmt(row.price) + ' ₽</td><td>' + perDoc + '</td></tr>';
      }).join('') +
      '</tbody></table></div>' +
      '<p class="price-note">Цены — с учётом НДС.</p>' +
      '</div></details>';

    return '<div class="result"><h2>Ваш расчёт</h2>' + (headHtml || '') + bodyHtml + '</div>';
  }
