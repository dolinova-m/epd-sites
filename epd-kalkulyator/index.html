    notes: [ 'Наёмному сотруднику нужна МЧД — машиночитаемая доверенность. Бесплатно, в личном кабинете Платформы ЭПД.' ]
  };

  // УКЭП юрлица нужна всем — с неё начинается регистрация. Дальше смотрим, где подписывают
  // (рейс, приёмка, офис) и кто подписывает (ответ про наёмных сотрудников).
  // Место подписания задано полем place, а не текстом плашки: плашки переписывают часто,
  // а от этого зависят и порядок блоков, и цвет.
  function onPhone(line) {
    return line.place === 'phone';
  }

  // Блоки идут группами: сначала подписи для работы за компьютером, потом для телефона —
  // иначе плашки чередуются и список читается рванее.
  function byPlace(lines) {
    return lines.filter(function (line) { return !onPhone(line); })
      .concat(lines.filter(onPhone));
  }

  function signLines() {
    var staff = hasHiredPeople();
    // Тому, кто только принимает грузы, показываем, чем подписывать приёмку с телефона:
    // собственнику нужен токен с NFC, наёмному сотруднику хватит бесплатного Госключа.
    if (onlyReceiver()) {
      // Офисный блок говорит про МЧД то же самое, поэтому в блоке про телефон примечание
      // оставляем только там, где офисного блока нет.
      var phone = staff
        ? Object.assign({}, SIGN_RECEIVE_PHONE, { notes: [] })
        : SIGN_RECEIVE_PHONE;
      return byPlace(staff ? [ SIGN_REG, SIGN_OFFICE, phone ] : [ SIGN_REG, phone ]);
    }
    var lines = [ SIGN_REG ];
    // Где подписывают — выводим из ролей: в рейсе документы подписывает перевозчик,
    // получатель может и с компьютера, и с телефона, остальные роли работают в кабинете.
    if (roleNeeded('perevozchik')) {
      // Заказ-заявки и у перевозчика обычно оформляет логист за компьютером, поэтому офисная строка тоже нужна.
      if (staff) { lines.push(SIGN_DRIVER, SIGN_OFFICE); }
      lines.push(SIGN_NFC);
    } else if (staff) {
      lines.push(SIGN_OFFICE);
    }
    return byPlace(lines);
  }

  function signSections() {
    var html = '<div class="result"><h2>Какие подписи вам нужны</h2>' +
      signLines().map(function (line) {
        var badge = line.badge
          ? '<div class="sign-badge' + (onPhone(line) ? ' phone' : '') + '">' + line.badge + '</div>'
          : '';
        return '<div class="sign-row">' + badge + '<div class="sign-name">' + line.title + '</div>' +
          line.text.map(function (t) { return '<div class="sign-desc">' + t + '</div>'; }).join('') +
          line.notes.map(function (n) { return '<div class="sign-note"><span>' + n + '</span></div>'; }).join('') +
          '</div>';
      }).join('') +
      '<p class="sign-foot">Подробную инструкцию — где купить токен, как записать подпись, настроить компьютер ' +
      'для работы с электронными подписями, выпустить Госключ и сделать доверенности на сотрудников — пришлём после регистрации в ' +
      '<a href="https://epd.platformaofd.ru" target="_blank" rel="noopener">личном кабинете</a>.</p>' +
      '</div>';
    return [ { id: 'sec-sign', nav: 'Подписи', html: html } ];
  }

  // Пять секций результата (регистрация, кабинет, приложение, «что может пойти не так»,
  // финальная) отложены до доработки содержания — лежат в отложенные-секции.md рядом.
  // Кнопка отправляет вторую заявку с пометкой «просит перезвонить» — см. sendLead('callback')
  // в обработчике ниже. Прод index.html этого пока не делает.
  function renderCallbackForm() {
    return '<div class="result" id="callback-section">' +
      '<div class="result-eyebrow">Остались вопросы?</div><h2>Оставьте заявку — перезвоним</h2>' +
      '<div class="lead-form" id="callback-form">' +
      '<label for="cb-name">Имя</label><input type="text" id="cb-name" placeholder="Как к вам обращаться">' +
      '<label for="cb-phone">Телефон</label><input type="tel" id="cb-phone" placeholder="+7 ..." value="' + escapeHtml(state.contact.phone) + '">' +
      '<label for="cb-email">Почта</label><input type="email" id="cb-email" placeholder="you@example.com" value="' + escapeHtml(state.contact.email) + '">' +
      '<label for="cb-inn">ИНН компании</label><input type="text" id="cb-inn" placeholder="10 или 12 цифр">' +
      HONEYPOT_HTML +
      '<button type="button" class="btn btn-primary btn-inline" id="btn-callback-submit">Отправить заявку</button>' +
      '<p class="lead-note" id="cb-error" role="alert"></p>' +
      '</div></div>';
  }

  function renderContactsSection() {
    return '<div class="section-head" id="contacts"><h2>Поддержка и контакты</h2><p>Куда обращаться на каждом шаге.</p></div>' +
      '<div class="contacts">' +
      '<div class="ccard"><div class="cc-role">Техподдержка</div><div class="cc-name">Специалисты именно по ЭПД</div><div class="cc-line"><a href="mailto:epd@platformaofd.ru">epd@platformaofd.ru</a></div>' +
      '<ol class="cc-steps"><li>Опишите проблему, лучше со скриншотом.</li><li>Укажите ИНН и телефон для связи.</li><li>Если нужно подключиться удалённо — скачайте <a href="https://rudesktop.ru/" target="_blank" rel="noopener">RuDesk</a> и укажите в письме свой идентификатор.</li></ol></div>' +
      '<div class="ccard"><div class="cc-role">Оформление УКЭП</div><div class="cc-name">Партнёр — УЦ «Основание»</div><div class="cc-line"><a href="https://platformaofd.ru/services/kep/" target="_blank" rel="noopener">platformaofd.ru/services/kep</a></div><div class="cc-line">Подходит любой аккредитованный УЦ</div></div>' +
      '<div class="ccard"><div class="cc-role">Консультации</div><div class="cc-name">Вопросы по подключению и тарифам</div><div class="cc-line"><a href="tel:+74952525050">+7 (495) 252-50-50</a></div></div>' +
      '<div class="ccard"><div class="cc-role">Заказ токена</div><div class="cc-name">Обычный или с NFC</div><div class="cc-line"><a href="tel:+74955408955">+7 (495) 540-89-55</a></div><div class="cc-line"><a href="mailto:info@platformatd.ru">info@platformatd.ru</a></div></div>' +
      '</div>';
  }

  // Подсветка активного пункта оглавления: в длинном результате иначе непонятно, где ты сейчас.
  // Переход по клику делает сам якорь — плавность даёт scroll-behavior в CSS.
  // Обработчик скролла живёт дольше разметки, поэтому снимаем его сами при каждой перерисовке.
  var tocScroll = null;

  function wireToc() {
    var links = [].slice.call(document.querySelectorAll('.toc-link'));
    if (!links.length) return;
    var targets = links.map(function (link) { return document.getElementById(link.getAttribute('href').slice(1)); });
    var ticking = false;
    function sync() {
      ticking = false;
      var active = 0;
      targets.forEach(function (el, i) { if (el && el.getBoundingClientRect().top <= 140) active = i; });
      links.forEach(function (link, i) { link.classList.toggle('active', i === active); });
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(sync);
    }
    tocScroll = onScroll;
    window.addEventListener('scroll', onScroll, { passive: true });
    sync();
  }

  function renderMainResult() {
    var app = document.getElementById('app');
    var o = otpCounts();
    var roleChips = [];
    if (o.selfEpl) roleChips.push('Отправитель (своей машиной)');
    if (o.naemEzz) roleChips.push('Отправитель (через перевозчика)');
    if (o.ekspEpe || o.ekspEzz) roleChips.push('Отправитель (через экспедитора)');
    if (roleNeeded('perevozchik')) roleChips.push('Перевозчик');
    if (roleNeeded('poluchatel')) roleChips.push('Получатель');
    if (state.roles.has('ekspeditor')) roleChips.push('Экспедитор (' + (ekspOwns() ? 'с владением' : 'без владения') + ')');

    var closedLines = closedReasons().map(function (c) {
      return '<li><b>' + c.who + '</b> — ' + c.text + '</li>';
    });
    var closedHtml = closedLines.length ? '<div class="callout info"><b>Где ЭПД не нужен:</b><ul class="closed-list">' + closedLines.join('') + '</ul></div>' : '';

    // Содержимое и оглавление собираются из одного списка: иначе пункт легко разойдётся
    // с тем, что реально отрисовано. nav: null — блок на странице есть, в оглавлении его нет.
    var sections = [
      { id: 'sec-result', nav: 'Ваш результат', html:
        '<div class="result">' +
        '<div class="result-head"><div>' +
        '<div class="result-eyebrow">Ваш персональный результат</div>' +
        '<h2>Вот что мы посчитали для вас</h2></div>' +
        '<button type="button" class="btn btn-outline" id="btn-pdf">↓ Скачать PDF</button></div>' +
        '<div class="facts">' + roleChips.map(function (c) { return '<span class="fact-chip good">' + c + '</span>'; }).join('') + '</div>' +
        closedHtml +
        '</div>' },
      { id: 'sec-money', nav: 'Расчёт и цена', html: renderMoneySection() },
      { id: 'sec-register-top', nav: null, html: renderRegisterCTA() },
      { id: 'sec-docs', nav: 'Ваши документы', html: renderDocsSection() }
    ].concat(signSections(), [
      // Ещё пять секций отложены до доработки содержания — их код в отложенные-секции.md рядом.
      { id: 'sec-callback', nav: 'Заявка менеджеру', html: renderCallbackForm() },
      { id: 'sec-contacts', nav: 'Поддержка и контакты', html: renderContactsSection() },
      { id: 'sec-register-bottom', nav: null, html: renderRegisterCTA() }
    ]);

    var tocHtml = '<nav class="toc" aria-label="Разделы расчёта">' +
      '<div class="toc-title">На этой странице</div><div class="toc-links">' +
      sections.filter(function (sec) { return sec.nav; }).map(function (sec) {
        return '<a class="toc-link" href="#' + sec.id + '">' + sec.nav + '</a>';
      }).join('') + '</div></nav>';

    var html = '<div class="quiz-shell result-layout">' + tocHtml + '<div class="result-main">' +
      sections.map(function (sec) {
        return '<section class="res-section" id="' + sec.id + '">' + sec.html + '</section>';
      }).join('') +
      '<div class="restart-callout" id="btn-restart" role="button" tabindex="0">' +
      '<div class="restart-callout-icon">↺</div>' +
      '<div class="restart-callout-text"><b>Совмещаете ещё одну роль или ситуацию?</b><p>Условия другой перевозки отличаются — пройдите калькулятор ещё раз.</p></div>' +
      '<span class="btn btn-primary">↺ Пройти калькулятор заново</span>' +
      '</div>' +
      '</div></div>';
    app.innerHTML = html;
    var pdfBtn = document.getElementById('btn-pdf');
    if (pdfBtn) pdfBtn.addEventListener('click', printResult);
    wireRestart();
    wireToc();
    document.querySelectorAll('[data-callback-link]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var section = document.getElementById('callback-section');
        if (!section) return;
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
        var firstField = document.getElementById('cb-name');
        if (firstField) firstField.focus({ preventScroll: true });
      });
    });
    var callbackBtn = document.getElementById('btn-callback-submit');
    if (callbackBtn) callbackBtn.addEventListener('click', function () {
      var name = document.getElementById('cb-name').value.trim();
      var phone = document.getElementById('cb-phone').value.trim();
      var email = document.getElementById('cb-email').value.trim();
      var problem = !name ? { id: 'cb-name', text: ERR_NAME }
        : !phoneOk(phone) ? { id: 'cb-phone', text: ERR_PHONE }
        : !emailOk(email) ? { id: 'cb-email', text: ERR_EMAIL }
        : null;
      if (problem) {
        // Молчаливый выход выглядел бы как сломанная кнопка, а заявка просто пропадала бы.
        var err = document.getElementById('cb-error');
        err.textContent = problem.text;
        err.style.color = 'var(--paid)';
        document.getElementById(problem.id).focus();
        return;
      }
      sendLead('callback', {
        name: name,
        phone: phone,
        inn: document.getElementById('cb-inn').value.trim(),
        email: email
      });
      document.getElementById('callback-form').innerHTML = '<p class="form-success">Спасибо! Скоро свяжемся.</p>';
    });
  }

  // ---------------------------------------------------------------------
  // MAIN RENDER
  // ---------------------------------------------------------------------
  function render() {
    if (tocScroll) { window.removeEventListener('scroll', tocScroll); tocScroll = null; }
    if (!state.started) { renderStart(); return; }
    if (state.showResult) {
      if (allRolesExcluded()) { renderAllExcludedResult(); return; }
      renderMainResult(); return;
    }
    var fn = STEP_RENDERERS[currentId];
    if (fn) fn(); else renderStart();
  }

  // Состояние квиза нигде не сохраняется, поэтому скопированная ссылка всегда открывает старт.
  // Убираем только якорь из адреса: он мог остаться от оглавления результата и в чужой вкладке
  // указывает на раздел, которого ещё нет.
  if (location.hash && window.history && window.history.replaceState) {
    window.history.replaceState(null, '', location.pathname + location.search);
  }

  render();
})();
</script>

</body>
</html>
